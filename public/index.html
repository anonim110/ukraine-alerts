<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="Мінімалістична мапа актуальних повітряних тривог в Україні." />
  <title>Тривоги України</title>

  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Тривоги України">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>ТРИВОГИ<br>УКРАЇНИ</span>
      </a>

      <div class="topbar-actions">
        <div class="live-state" id="liveState">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="liveText">Підключення</span>
        </div>
        <button class="icon-button" id="soundButton" type="button" aria-pressed="false">ЗВУК: ВИМК</button>
      </div>
    </header>

    <main class="layout">
      <section class="map-panel" aria-label="Мапа тривог України">
        <div id="map" class="map"></div>

        <div class="map-title">
          <p>СТАН ЗАРАЗ</p>
          <h1><span id="activeCount">—</span> областей<br>з активною тривогою</h1>
        </div>

        <div class="legend" aria-label="Легенда карти">
          <span><i class="legend-box danger"></i> Тривога</span>
          <span><i class="legend-box partial"></i> Тривога в районі</span>
          <span><i class="legend-box safe"></i> Немає активних</span>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-head">
          <div>
            <p class="eyebrow">АКТИВНІ ПОДІЇ</p>
            <h2>Області</h2>
          </div>
          <button id="refreshButton" class="text-button" type="button">ОНОВИТИ</button>
        </div>

        <label class="search-wrap">
          <span class="sr-only">Пошук області</span>
          <input id="searchInput" type="search" placeholder="Пошук області" autocomplete="off" />
        </label>

        <div class="notice hidden" id="notice"></div>
        <div class="region-list" id="regionList" aria-live="polite"></div>

        <footer class="sidebar-footer">
          <span id="updatedAt">Оновлення: —</span>
          <span>Дані: <a href="https://tryvoha.online/" target="_blank" rel="noreferrer">Tryvoha.online</a></span>
        </footer>
        <p class="safety-note">Інформаційний сервіс. Для рішень щодо безпеки користуйтеся офіційними каналами та вказівками влади.</p>
      </aside>
    </main>
  </div>

  <template id="regionTemplate">
    <article class="region-row">
      <div class="region-index"></div>
      <div class="region-copy">
        <div class="region-title-line">
          <h3></h3>
          <span class="region-duration"></span>
        </div>
        <div class="region-types"></div>
      </div>
      <button class="locate-button" type="button" aria-label="Показати на карті">↗</button>
    </article>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
