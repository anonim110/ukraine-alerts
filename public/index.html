<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="Мапа актуальних повітряних тривог в Україні по областях і районах." />
  <title>Тривоги України</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Тривоги України">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-copy"><strong>ТРИВОГИ</strong><small>УКРАЇНИ</small></span>
      </a>

      <div class="topbar-status">
        <div class="live-state" id="liveState">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="liveText">Підключення</span>
        </div>
        <div class="top-stat"><b id="topActiveCount">—</b><span>обл.</span></div>
        <div class="top-stat"><b id="topDistrictCount">—</b><span>рай.</span></div>
      </div>

      <button class="icon-button" id="soundButton" type="button" aria-pressed="false">ЗВУК ВИМК</button>
    </header>

    <main class="layout">
      <section class="map-panel" aria-label="Мапа тривог України">
        <div id="map" class="map"></div>

        <div class="map-title">
          <p>СТАН ЗАРАЗ</p>
          <h1><span id="activeCount">—</span> областей</h1>
          <div class="map-subline"><b id="districtCount">—</b> районів з активною тривогою</div>
        </div>

        <div class="legend" aria-label="Легенда карти">
          <span><i class="legend-box danger"></i> Область</span>
          <span><i class="legend-box partial"></i> Район</span>
          <span><i class="legend-box safe"></i> Немає</span>
        </div>
      </section>

      <aside class="sidebar">
        <div class="sidebar-head">
          <div>
            <p class="eyebrow">АКТИВНІ ПОДІЇ</p>
            <h2>Області <span>/ райони</span></h2>
          </div>
          <button id="refreshButton" class="text-button" type="button">ОНОВИТИ</button>
        </div>

        <label class="search-wrap">
          <span class="sr-only">Пошук області або району</span>
          <span class="search-mark">⌕</span>
          <input id="searchInput" type="search" placeholder="Пошук області або району" autocomplete="off" />
        </label>

        <div class="notice hidden" id="notice"></div>
        <div class="region-list" id="regionList" aria-live="polite"></div>

        <div class="sidebar-meta">
          <span id="updatedAt">Оновлення: —</span>
          <span>Дані: <a href="https://tryvoha.online/" target="_blank" rel="noreferrer">Tryvoha.online</a></span>
        </div>
        <p class="safety-note">Інформаційний сервіс. Для безпеки користуйтеся офіційними каналами та вказівками влади.</p>
      </aside>
    </main>
  </div>

  <template id="regionTemplate">
    <article class="region-row">
      <div class="region-main">
        <div class="region-index"></div>
        <div class="region-copy">
          <div class="region-title-line">
            <h3></h3>
            <span class="region-duration"></span>
          </div>
          <div class="region-status-line">
            <span class="status-word"></span>
            <span class="district-summary"></span>
          </div>
        </div>
        <button class="locate-button" type="button" aria-label="Показати область на карті">↗</button>
      </div>
      <div class="district-list"></div>
    </article>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
